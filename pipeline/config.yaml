# Kvia pipeline configuration (SPEC.md §4, §6, §7, §9). Values marked ASSUMPTION are team-accepted starting values.
reference_datetime: "2026-11-04T00:00:00"     # fixed reference date for the prototype (SPEC §5.1)
snapshot_date: "2026-10-26"
notice_export: data/raw/doffin_notices_2026-10-26_25.csv
mock_notices: data/mock/mock_notices.json      # invented MOCK-xxxx notices (Phase 1 only, never mixed into the export)
profiles_dir: data/profiles
adviser_decisions: data/adviser_decisions.json
recorded_manual_additions: data/mock/recorded_manual_additions.json
firm_flags: data/mock/firm_flags.json
tender_docs_dir: data/raw/tender_docs          # Phase 2: original PDFs, /{doffin_id}/
placeholder_docs_dir: data/mock/tender_docs    # Phase 1: PLACEHOLDER.json + generated placeholder PDF per notice
model:
  specified: "Claude Fable 5.1"                # AI mechanism chain.docx
  phase_1: "none — mock outputs generated by code from templates"
prompt_versions: {extraction: "extraction_v1", screening: "screening_v1", matching_classification: "matching_classification_v1"}
retrieval:
  top_k: 40
  bm25_k1: 1.5
  bm25_b: 0.75
  heading_patterns: ["kvalifikasjonskrav", "dokumentasjonskrav", "krav til", "kravspesifikasjon", "egnethet"]
  queries:
    qualification: [kvalifikasjonskrav, krav til leverandøren, egnethet, skal, minimum, qualification]
    technical: [kravspesifikasjon, teknisk, tekniske krav, skal, utstyr, technical]
    financial: [økonomisk, finansiell, omsetning, kredittvurdering, forsikring, financial, turnover]
    certification: [sertifikat, sertifisert, godkjenning, sentral godkjenning, ISO, certificate]
    hms: [HMS, helse, miljø, sikkerhet, egenerklæring]
    reference: [referanser, erfaring, sammenlignbare oppdrag, referanseliste, references]
    capacity: [kapasitet, bemanning, nøkkelpersonell, CV, kjøretøy, utstyr, capacity]
    formal: [skatteattest, attest, dokumentasjonskrav, StartBANK, lærebedrift, språk]
screening:
  weights:                                      # ASSUMPTION (SPEC §6)
    subject_relevance: 0.50
    region: 0.15
    contract_subject: 0.10
    size: 0.10
    contract_form: 0.05
    framework_dps: 0.05
    lots: 0.05
  threshold: 60                                 # ASSUMPTION (SPEC §6)
  confidence_weight_floor: 0.10                 # missing data points with w >= this lower confidence one level
  confidence_bands: [high, medium, low]
readiness:
  tax_certificate_max_age_months: 6             # ASSUMPTION (SPEC §7)
  expiring_soon_days_after_deadline: 30         # ASSUMPTION (SPEC §7)
health_check:
  expiring_within_days: 60                      # ASSUMPTION (agent default, Phase 1): profile health-check window
